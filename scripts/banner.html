<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;width:1280px;height:640px;overflow:hidden}
  .canvas{position:relative;width:1280px;height:640px;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(820px 520px at 90% -10%, rgba(139,92,246,.50), transparent 62%),
      radial-gradient(680px 420px at 0% 115%, rgba(34,211,238,.28), transparent 60%),
      radial-gradient(560px 340px at 55% 130%, rgba(236,72,153,.18), transparent 65%),
      linear-gradient(112deg,#0a0d1e 0%,#12123c 36%,#291a63 66%,#4b2a89 100%);
  }
  .grid{position:absolute;inset:-2px;opacity:.45;
    background-image:radial-gradient(rgba(255,255,255,.15) 1px,transparent 1.5px);
    background-size:30px 30px;
    -webkit-mask-image:linear-gradient(100deg,transparent 0%,#000 25%,#000 75%,transparent 100%);
    mask-image:linear-gradient(100deg,transparent 0%,#000 25%,#000 75%,transparent 100%);
  }
  .ghost{position:absolute;color:#c7d2fe;opacity:.06}
  .ghost svg{display:block}
  .ghost.left{left:-70px;bottom:-110px;transform:rotate(-14deg)}
  .ghost.left svg{width:380px;height:380px}
  .ghost.right{right:-50px;top:-90px;transform:rotate(12deg)}
  .ghost.right svg{width:340px;height:340px}
  .brand{position:absolute;left:84px;top:50%;transform:translateY(-50%);z-index:2}
  .eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .eyebrow i{display:block;width:52px;height:4px;border-radius:3px;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}
  .eyebrow span{font-size:19px;font-weight:600;letter-spacing:5px;color:rgba(203,213,255,.78)}
  .title{font-size:98px;font-weight:800;letter-spacing:-2px;line-height:1;
    background:linear-gradient(96deg,#eef0ff 0%,#a5b4fc 38%,#8b5cf6 68%,#e879f9 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 30px rgba(139,92,246,.4));
  }
  .subtitle{margin-top:22px;font-size:23px;color:rgba(199,210,254,.72);letter-spacing:.5px}
  .row{position:absolute;right:84px;top:50%;transform:translateY(-50%);display:flex;gap:26px;z-index:2}
  .tile{width:132px;height:132px;border-radius:34px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1px solid rgba(196,181,253,.30);
  }
  .tile svg{width:62px;height:62px}
  .t1{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 44px rgba(5,3,25,.5),0 0 56px rgba(34,211,238,.30)}
  .t2{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 44px rgba(5,3,25,.5),0 0 56px rgba(139,92,246,.34)}
  .t3{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 44px rgba(5,3,25,.5),0 0 56px rgba(236,72,153,.28)}
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="ghost left">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
    </svg>
  </div>
  <div class="ghost right">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/>
    </svg>
  </div>
  <div class="brand">
    <div class="eyebrow"><i></i><span>Telegram-магазин гаджетов</span></div>
    <div class="title">Nebula Shop</div>
    <div class="subtitle">Каталог · ИИ-консультант · Telegram Stars · Бонусы</div>
  </div>
  <div class="row">
    <div class="tile t1">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#bg1)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="bg1" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/>
        </linearGradient></defs>
        <rect x="7" y="5" width="10" height="14" rx="3.2"/><path d="M9 5V2.6h6V5M9 19v2.4h6V19"/>
        <path d="M17.4 9.4H19v2.2h-1.6"/><path d="M9.8 8.8h4.4M9.8 11.6h4.4M9.8 14.4h2.6"/>
      </svg>
    </div>
    <div class="tile t2">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#bg2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="bg2" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#8b5cf6"/>
        </linearGradient></defs>
        <ellipse cx="9" cy="7.4" rx="1.9" ry="2.5"/><path d="M9 9.9v2.2"/>
        <ellipse cx="15" cy="7.4" rx="1.9" ry="2.5"/><path d="M15 9.9v2.2"/>
        <rect x="5.6" y="12.6" width="12.8" height="6.6" rx="3.2"/>
      </svg>
    </div>
    <div class="tile t3">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#bg3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="bg3" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f9a8d4"/><stop offset="1" stop-color="#db2777"/>
        </linearGradient></defs>
        <rect x="6.6" y="3.6" width="10.8" height="16.8" rx="3.2"/><circle cx="12" cy="14.4" r="3.5"/>
        <circle cx="12" cy="14.4" r="1.2"/><circle cx="12" cy="7.6" r="1.5"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
