<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; width: 960px; height: 540px; overflow: hidden;
    background: #06070f; font-family: "Segoe UI", system-ui, sans-serif;
  }
  .bg {
    position: fixed; left: 50%; top: 50%; width: 390px; height: 844px;
    transform: translate(-50%, -50%) scale(2.6);
    filter: blur(10px) brightness(0.42) saturate(1.1);
    border: 0; pointer-events: none;
  }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(6, 7, 15, 0) 38%, rgba(6, 7, 15, 0.55) 100%);
  }
  .phone {
    position: fixed; left: 50%; top: 50%; width: 390px; height: 844px;
    transform: translate(-50%, -50%) scale(0.615);
    border-radius: 38px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), 0 0 70px rgba(139, 92, 246, 0.22);
  }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<iframe class="bg" id="bg" scrolling="no"></iframe>
<div class="vignette"></div>
<div class="phone"><iframe id="frame" scrolling="no"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get("src") || "http://127.0.0.1:8080/";
  document.getElementById("bg").src = src;
  document.getElementById("frame").src = src;
</script>
</body>
</html>
