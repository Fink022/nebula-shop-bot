<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; min-height: 100vh; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(700px 560px at 82% -10%, rgba(139, 92, 246, 0.35), transparent 62%),
      radial-gradient(640px 520px at 0% 112%, rgba(34, 211, 238, 0.22), transparent 60%),
      #0a0b18;
    font-family: "Segoe UI", sans-serif;
  }
  .frame { padding: 56px; border-radius: 76px; }
  .phone {
    position: relative; width: 390px; height: 844px;
    border-radius: 46px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 46px 130px rgba(0, 0, 0, 0.65), 0 0 90px rgba(139, 92, 246, 0.28);
  }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<div class="frame">
  <div class="phone"><iframe id="frame"></iframe></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("frame").src = q.get("src") || "http://127.0.0.1:8080/";
</script>
</body>
</html>
